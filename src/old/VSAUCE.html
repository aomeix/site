<!DOCTYPE html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="https://yt3.googleusercontent.com/ytc/AIdro_mpYedipdXUXCKkwjQEeFrepFlDHZ0LiczqWeKyG0YmJvA=s160-c-k-c0x00ffffff-no-rj">
    <title>VSAUCE</title>
    <style>
        @font-face {
            font-family: 'alsina';
            src: url('assets/alsina.woff2') format('woff2');
            font-weight: normal;
            font-style: normal;
            font-display: swap;
        }

        :root {
            --vsauce-green: #a3ff00;
        }

        *, *::before, *::after {
            box-sizing: border-box;
        }

        body, html {
            -webkit-user-select: none;
            user-select: none;
            font-family: 'alsina', sans-serif;
            margin: 0;
            padding: 0;
            height: 100%;
            background-color: #000;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        .marquee-container {
            background-color: var(--vsauce-green);
            color: black;
            font-size: clamp(2rem, 6vh, 4.5rem); 
            padding: 5px 0;
            overflow: hidden;
            width: 100%;
            border-top: 6px solid black;
            border-bottom: 6px solid black;
            display: flex;
            position: relative;
            z-index: 30;
            will-change: transform;
        }

        .marquee-track {
            display: flex;
            width: max-content;
            flex-shrink: 0;
            will-change: transform;
        }

        .scroll-left {
            animation: move-left 20s linear infinite;
        }

        .scroll-right {
            animation: move-right 20s linear infinite;
        }

        @keyframes move-left {
            0% { transform: translate3d(0, 0, 0); }
            100% { transform: translate3d(-50%, 0, 0); }
        }

        @keyframes move-right {
            0% { transform: translate3d(-50%, 0, 0); }
            100% { transform: translate3d(0, 0, 0); }
        }

        .marquee-item {
            padding: 0 2vw;
            white-space: nowrap;
            text-transform: uppercase;
            font-weight: bold;
        }
        .shrine-content {
            flex: 1;
            width: 100%;
            position: relative;
            background-color: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .bg-text-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            display: flex;
            justify-content: space-evenly; 
            pointer-events: none;
            transform: scaleY(3);
            transform-origin: center;
        }

        .vertical-column {
            display: flex;
            flex-direction: column;
            color: white;
            font-size: clamp(3rem, 8vw, 10rem);
            line-height: 0.7; 
            overflow: hidden;
        }

        .vertical-track {
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
            animation: scroll-v 12s linear infinite;
            will-change: transform;
        }

        @keyframes scroll-v {
            0% { transform: translate3d(0, 0, 0); }
            100% { transform: translate3d(0, -50%, 0); }
        }

        .shrine-content img {
            position: relative;
            z-index: 10; 
            max-width: 80%;
            max-height: 80%;
            object-fit: contain;
            display: block;
        }

        #overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: black;
            z-index: 100;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
        }

        #overlay h1 {
            color: var(--vsauce-green);
            font-family: 'alsina', sans-serif;
            text-transform: uppercase;
        }
    </style>
</head>
<body>
    <div class="marquee-container">
        <div class="marquee-track scroll-left" data-text="HEY VSAUCE, MICHAEL HERE..."></div>
    </div>
    <div class="shrine-content">
        <div class="bg-text-layer">
            <div class="vertical-column"><div class="vertical-track" data-vtext="VSAUCE"></div></div>
            <div class="vertical-column"><div class="vertical-track" data-vtext="VSAUCE"></div></div>
            <div class="vertical-column"><div class="vertical-track" data-vtext="VSAUCE"></div></div>
            <div class="vertical-column"><div class="vertical-track" data-vtext="VSAUCE"></div></div>
        </div>
        <img src="michael_here.jpg" alt="michael here!">
    </div>
    <div class="marquee-container">
        <div class="marquee-track scroll-right" data-text="AND AS ALWAYS, THANKS FOR WATCHING..."></div>
    </div>
    <audio id="music" loop>
        <source src="moon_men.mp3" type="audio/mpeg">
    </audio>
    <div id="overlay">
        <h1>Enter!</h1>
    </div>
    <script>
        document.querySelectorAll('.marquee-track').forEach(track => {
            const text = track.dataset.text;
            let content = '';
            for (let i = 0; i < 10; i++) {
                content += `<span class="marquee-item">${text}</span>`;
            }
            track.innerHTML = content + content;
        });
        document.querySelectorAll('.vertical-track').forEach(track => {
            const text = track.dataset.vtext;
            let content = '';
            for (let i = 0; i < 8; i++) {
                content += `<span>${text}</span>`;
            }
            track.innerHTML = content + content;
        });
        const overlay = document.getElementById('overlay');
        const audio = document.getElementById('music');

        overlay.addEventListener('click', () => {
            overlay.style.opacity = "0";
        });
    </script>
</body>
</html>
