<!DOCTYPE html>
<head>
  <meta charset="UTF-8">
  <title>Chat</title>
</head>
<body>
    <i>Connecting may take a while!</i>
  <div id="login-section">
    <h2>Connect to Chat!</h2>
    <form id="login-form">
      <div>
        <label>Screenname:</label><br>
        <input type="text" id="username" required>
      </div>
      <div>
        <label>Server:</label><br>
        <input type="text" id="server" value="chat-azi3.onrender.com" required disabled>
      </div>
      <div>
        <label>Port:</label><br>
        <input type="number" id="port" value="443" required disabled>
      </div>
      <br>
      <button type="submit">Go Chat!</button>
    </form>
  </div>
  <div id="chat-section" style="display: none;">
    <div id="chat-box"></div>
    
    <form id="message-form">
      <input type="text" id="message-input" placeholder="..." autocomplete="off" required>
      <button type="submit">Send!</button>
    </form>
  </div>

  <script src="app.js"></script>
</body>
</html>
